events {
        worker_connections 1024;
    }

    http {
        server_tokens off;

        client_body_buffer_size 10K;
        client_header_buffer_size 1k;
        client_max_body_size 1m;
        large_client_header_buffers 2 1k;

        limit_req_zone $binary_remote_addr zone=fortress_limit:10m rate=10r/s;

        server {
            listen 80;

            limit_req zone=fortress_limit burst=15 nodelay;

            if ($request_method !~ ^(GET|POST)$) {
                return 405;
            }

            if ($http_user_agent ~* (sqlmap|nikto|wpscan|masscan|zgrab|gobuster|dirbuster)) {
                return 444;
            }

            location ~* (\.git|\.env|\.bak|\.swp|phpmyadmin|wp-login) {
                return 444;
            }

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self';" always;

            location / {
                proxy_pass http://172.20.0.20:80;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
